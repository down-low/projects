# The daily trade summary: once a morning, members whose Board posts alert is "Daily summary" get the new board posts
# they could take (firebase/functions: dailySummary). Needs the ALERT_KEY secret and FIREBASE_PROJECT_ID variable;
# skipped until both are set.
name: Daily trade alerts

on:
  schedule:
    - cron: "0 14 * * *" # 7:00 Pacific in summer, 6:00 in winter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Send the summary
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
        run: |
          if [ -z "$ALERT_KEY" ]; then echo "ALERT_KEY isn't set; skipping."; exit 0; fi
          curl -fsS -X POST -H "X-Alert-Key: $ALERT_KEY" "https://us-central1-$PROJECT.cloudfunctions.net/dailySummary"
