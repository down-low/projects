<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Date Picker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1>Calendar Date Picker</h1>

    <div class="picker-wrapper">
      <label for="date-input">Select a date</label>
      <div class="input-row">
        <input
          type="text"
          id="date-input"
          class="date-input"
          placeholder="MM / DD / YYYY"
          readonly
          aria-haspopup="true"
          aria-expanded="false"
        />
        <button class="clear-btn" id="clear-btn" aria-label="Clear date" hidden>&#x2715;</button>
      </div>

      <div class="calendar" id="calendar" role="dialog" aria-label="Date picker" hidden>
        <div class="cal-header">
          <button class="nav-btn" id="prev-year" aria-label="Previous year">&laquo;</button>
          <button class="nav-btn" id="prev-month" aria-label="Previous month">&lsaquo;</button>
          <div class="month-year" id="month-year"></div>
          <button class="nav-btn" id="next-month" aria-label="Next month">&rsaquo;</button>
          <button class="nav-btn" id="next-year" aria-label="Next year">&raquo;</button>
        </div>

        <div class="cal-weekdays">
          <span>Su</span><span>Mo</span><span>Tu</span>
          <span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
        </div>

        <div class="cal-grid" id="cal-grid" role="grid" aria-label="Calendar days"></div>

        <div class="cal-footer">
          <button class="today-btn" id="today-btn">Today</button>
        </div>
      </div>
    </div>

    <p class="selected-display" id="selected-display"></p>
  </div>

  <script src="datepicker.js"></script>
</body>
</html>
